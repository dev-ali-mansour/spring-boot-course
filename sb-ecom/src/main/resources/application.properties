spring.application.name=sb-ecom
# Environment Specific Configuration
spring.config.import=optional:file:.env[.properties]
# Database Connection (Environment Variables with Local Dev Defaults)
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=${DB_DRIVER}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# File Upload
project.images.path=images/
# JWT Authentication
spring.app.jwt.secret=${JWT_SECRET_BASE64}
spring.app.jwt.expirationMs=3000000
spring.app.jwt.cookieName=springBootEcom
# Server Port
server.port=${SERVER_PORT:8080}
#URLS
frontend.url=${FRONTEND_URL}
image.base.url=${IMAGE_BASE_URL}
# Stripe Key
stripe.secret=${STRIPE_SECRET}