spring.application.name=sb-ecom
# Database Connection (Environment Variables with Local Dev Defaults)
spring.datasource.url=${DB_URL:jdbc:h2:mem:db}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
# File Upload
project.images.path=images/
# JWT Authentication
spring.app.jwt.secret=${JWT_SECRET_BASE64}
spring.app.jwt.expirationMs=3000000
spring.app.jwt.cookieName=springBootEcom
# Logging
#logging.level.org.springframework=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.springframework.security=DEBUG
#logging.level.dev.alimansour.sbecom=DEBUG
# Server Port
server.port=${SERVER_PORT:8080}